# DexGEO — site estático + Netlify Functions (registro de uso e painel).
[build]
  publish = "public"
  command = "echo 'Sem etapa de build: site estático'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Leitor de PDF (MuPDF WebAssembly): versão no nome da pasta → cache longo e seguro
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# Painel administrativo: fora de buscadores e sem cache
[[headers]]
  for = "/painel-ppojsrd8gvv7q7/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "SAMEORIGIN"
